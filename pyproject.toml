[project]
name = "mle-02-p1-team1"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiosql>=15.0",
    "fonttools>=4.66.1",
    "langchain>=1.4.3",
    "langchain-openai>=1.6.6",
    "langchain-postgres>=0.0.18",
    "langchain-text-splitters>=1.1.2",
    "pandas>=3.0.6",
    "pgvector>=0.3.6",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.6",
    "pymupdf>=1.28.2",
    "pypdf[image]>=6.19.0",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=6.1.0",
    "sqlalchemy>=2.1.1",
    "streamlit>=1.64.0",
    "supabase>=2.31.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/car_search_rag"]
